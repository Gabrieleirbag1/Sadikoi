<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- "No item yet": a closed mystery box, in the style of images/items/ (flat colors, thick black outline). -->
  <g stroke="#000" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bow -->
    <path d="M256 170 C 214 96, 140 104, 150 146 C 158 176, 214 178, 256 170 Z" fill="#9AA3AE"/>
    <path d="M256 170 C 298 96, 372 104, 362 146 C 354 176, 298 178, 256 170 Z" fill="#9AA3AE"/>
    <!-- Body -->
    <rect x="100" y="236" width="312" height="208" rx="20" fill="#E3DACB"/>
    <!-- Lid, with its ribbon band -->
    <rect x="76" y="170" width="360" height="74" rx="20" fill="#CFC4B1"/>
    <rect x="234" y="170" width="44" height="74" fill="#9AA3AE"/>
  </g>
  <!-- Bow knot -->
  <circle cx="256" cy="168" r="22" fill="#7D8794" stroke="#000" stroke-width="18"/>
  <!-- Highlight -->
  <path d="M102 206 Q 106 190, 132 188" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <!-- Question mark: black stroke under a colored one = outlined glyph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 314 Q 222 284, 256 284 Q 290 284, 290 312 Q 290 332, 266 340 Q 256 344, 256 358 V 366" stroke="#000" stroke-width="46"/>
    <path d="M222 314 Q 222 284, 256 284 Q 290 284, 290 312 Q 290 332, 266 340 Q 256 344, 256 358 V 366" stroke="#8A94A1" stroke-width="26"/>
  </g>
  <circle cx="256" cy="404" r="19" fill="#8A94A1" stroke="#000" stroke-width="10"/>
</svg>
