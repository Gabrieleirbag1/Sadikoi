<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sadikoi</title>
  <base href="/">
  <!-- viewport-fit=cover: in the mobile app the page goes under the status bar; the --safe-* CSS variables keep content clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Link previews (Discord, WhatsApp, Messenger, X...). Crawlers don't run the app, so the text is here.
       scripts/localize-index.mjs builds index.fr.html from this file with the French text: keep both in sync. -->
  <meta name="description" content="A game for groups of friends: every day a new question, everyone votes for a friend, and the winner gets an item… until someone takes it from them.">
  <meta name="theme-color" content="#0b74d5">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sadikoi">
  <meta property="og:title" content="Sadikoi – the daily question game for friends">
  <meta property="og:description" content="A game for groups of friends: every day a new question, everyone votes for a friend, and the winner gets an item… until someone takes it from them.">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="fr_FR">
  <meta property="og:image" content="https://sadikoi.missclick.net/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sadikoi logo: a speech bubble with an S">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sadikoi – the daily question game for friends">
  <meta name="twitter:description" content="A game for groups of friends: every day a new question, everyone votes for a friend, and the winner gets an item… until someone takes it from them.">
  <meta name="twitter:image" content="https://sadikoi.missclick.net/og-image.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="boot-loader" class="app-loader" role="status" aria-live="polite">
    <div class="app-loader__spinner"></div>
    <span class="app-loader__label">Loading...</span>
  </div>
  <script>
    (function () {
      try {
        var user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.language === 'fr') {
          document.documentElement.lang = 'fr';
          document.querySelector('#boot-loader .app-loader__label').textContent = 'Chargement...';
        }
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
