<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sadikoi</title>
  <base href="/">
  <!-- viewport-fit=cover: in the mobile app the page goes under the status bar; the --safe-* CSS variables keep content clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="boot-loader" class="app-loader" role="status" aria-live="polite">
    <div class="app-loader__spinner"></div>
    <span class="app-loader__label">Loading...</span>
  </div>
  <script>
    (function () {
      try {
        var user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user && user.language === 'fr') {
          document.documentElement.lang = 'fr';
          document.querySelector('#boot-loader .app-loader__label').textContent = 'Chargement...';
        }
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
