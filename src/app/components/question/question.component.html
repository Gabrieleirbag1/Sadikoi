<section class="main-container">
  <div class="question-container">
    <div class="question-content">
      <span>{{ question()?.content }}</span>
      <app-item-image-display [itemName]="question()?.item_name" [imgClass]="'group-question-item'"></app-item-image-display>
    </div>
    <div class="calendar-anchor" #calendarAnchor>
      <span class="icon-button" role="button" tabindex="0" (click)="showCalendar()" title="{{ 'group.calendar' | translate }}">
        <img src="images/icons/calendar.svg" width="36" height="36" alt="List View" />
      </span>
      @if (showCalendarFlag()) {
        <div class="calendar-popover" role="tooltip">
          <app-calendar [group]="group()" [(question)]="question" (showCurrent)="showCurrentQuestion()"></app-calendar>
        </div>
      }
    </div>
  </div>
  @if (question()?.votes?.length) {
    <div class="question-votes-and-chat-container">
      <section class="question-votes-container">
        @if (question()?.canWrite) {
          <app-vote-bubbles [bubbles]="answerBubbles()" phase="results" [group]="group()" />
        } @else {
          <app-vote-bubbles [bubbles]="voteBubbles" phase="results" [group]="group()" />
        }
      </section>
      <section>
        <app-chat [group]="group()" [question]="question()" [readOnly]="isPastQuestion()"></app-chat>
      </section>
    </div>
  } @else {
    @if (question()?.canWrite) {
      <!-- Answer-type question: the textarea lives inside the bubbles area; bubbles bounce on it and cannot be picked. -->
      <app-vote-bubbles class="vote-bubbles-voting" [bubbles]="votingBubbles()" [group]="group()" phase="results">
        <div class="answer-card">
          <textarea
            class="answer-input"
            [placeholder]="'question.enterYourAnswer' | translate"
            (input)="answerText.set(answerInput.value)"
            #answerInput
          ></textarea>
          <div class="submit-vote-container">
            <button
              type="button"
              class="background-success"
              [disabled]="!answerText().trim()"
              (click)="submitVote(usersId, answerText().trim())"
            >
              {{ 'question.submitAnswer' | translate }}
            </button>
          </div>
        </div>
      </app-vote-bubbles>
    } @else {
      <app-vote-bubbles
        class="vote-bubbles-voting"
        [bubbles]="votingBubbles()"
        [group]="group()"
        phase="voting"
        [multiple]="!!question()?.enableMultipleVoting"
        (voted)="submitVote($event)"
      />
    }
  }
</section>
