<div class="calendar">
  <div class="calendar__header">
    <button type="button" class="calendar__nav" aria-label="Previous month" (click)="prevMonth()">‹</button>
    <span class="calendar__title">{{ title }}</span>
    <button type="button" class="calendar__nav" aria-label="Next month" (click)="nextMonth()">›</button>
  </div>

  <div class="calendar__weekdays">
    <span *ngFor="let day of weekdays">{{ day }}</span>
  </div>

  <div class="calendar__days">
    <button
      *ngFor="let day of days"
      type="button"
      class="calendar__day"
      [class.calendar__day--muted]="!day.isCurrentMonth"
      [class.calendar__day--today]="day.isToday"
      [class.calendar__day--selected]="day.isSelected"
      [class.calendar__day--disabled]="day.disabled"
      [disabled]="day.disabled"
      (click)="selectDay(day)"
    >
      {{ day.date }}
    </button>
  </div>

  <div class="calendar__footer">
    <button type="button" class="calendar__link" (click)="goToToday()">Today</button>
    <button type="button" class="calendar__link" (click)="clearSelection()">Clear</button>
  </div>
</div>
