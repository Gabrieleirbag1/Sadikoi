<div class="profile-image-picker">
  <img
    [src]="displayUrl()"
    [alt]="alt()"
    width="200"
    class="border"
    [class]="imgClass()"
    (click)="onImageClick($event)"
    (error)="onImageError($event)"
    [class.clickable]="!onlyDisplay()"
    [class.previewable]="previewable()"
  />
  @if (!onlyDisplay()) {
    <input
      #fileInput
      type="file"
      accept="image/*"
      (change)="onFileChange($event)"
      class="visually-hidden"
    />
  }
</div>
