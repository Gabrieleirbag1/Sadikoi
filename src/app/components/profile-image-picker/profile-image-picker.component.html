<div class="profile-image-picker">
  <img
    [src]="displayUrl()"
    alt="Profile Picture"
    width="200"
    [class]="imgClass()"
    (click)="openFilePicker()"
    [class.clickable]="!onlyDisplay()"
  />
  @if (!onlyDisplay()) {
    <input
      #fileInput
      type="file"
      accept="image/*"
      (change)="onFileChange($event)"
      class="visually-hidden"
    />
  }
</div>
