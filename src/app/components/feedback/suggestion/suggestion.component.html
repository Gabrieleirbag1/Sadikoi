<div class="feedback-form">
    <div>
        <label for="theme">{{ 'feedback.theme' | translate }}</label>
        <select id="theme" #theme>
            @for (option of themes(); track option.id) {
                <option [value]="option.id">{{ label(option) }}</option>
            }
            <option [value]="otherTheme">{{ 'feedback.themeOther' | translate }}</option>
        </select>
    </div>

    <div>
        <label for="question">{{ 'feedback.question' | translate }}</label>
        <textarea id="question" maxlength="200" #question></textarea>
    </div>

    <button class="paper-btn btn-block background-secondary" (click)="submitSuggestion(theme.value, question.value)">{{ 'feedback.submitSuggestion' | translate }}</button>
</div>
