@if (isOpen()) {
  <div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog border" role="document">
      <div class="modal-content">
        <div class="modal-header">
          @if (state != 'chose') {
            <span class="modal-back" (click)="changeGroupModalState('chose')">
              <
            </span>
          }
          <h5 class="modal-title">{{ config().title }}</h5>
          <span class="modal-close" (click)="discard($event)">X</span>
        </div>
        @if (state === 'chose') {
          <div class="group-modal-header-buttons">
            <button type="button" class="background-secondary" (click)="changeGroupModalState('create')">Créer un groupe</button>
            <button type="button" class="background-warning" (click)="changeGroupModalState('join')">Rejoindre un groupe</button>
          </div>
        }
        <div class="modal-body">
          <!-- <p>{{ config().description }}</p> -->
          @if (state === 'create') {
            <input type="text" [placeholder]="'groups.groupName' | translate" #groupName />
            <input type="text" [placeholder]="'groups.groupDescription' | translate" #groupDescription />
            <div class="group-modal-time-and-themes">
              <input type="time" [placeholder]="'groups.groupTime' | translate" #groupTime [value]="defaultTimeValue" />
              <app-themes [(selectedThemes)]="selectedThemes"></app-themes>
            </div>
            <button type="button" class="background-secondary" (click)="save()" [disabled]="selectedThemes.length === 0">
              {{ 'groups.createGroup' | translate }}
            </button>
          } @else if (state === 'join') {
            <app-join-group></app-join-group>
          }
        </div>
      </div>
    </div>
  </div>
}
