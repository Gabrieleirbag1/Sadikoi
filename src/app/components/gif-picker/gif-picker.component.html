<div class="gif-picker">
  <div class="gif-tabs">
    <button
      type="button"
      class="paper-btn btn-small"
      [class.background-secondary]="view() === 'recent'"
      (click)="setView('recent')"
    >{{ 'gifPicker.recent' | translate }}</button>
    <button
      type="button"
      class="paper-btn btn-small"
      [class.background-secondary]="view() === 'trending'"
      (click)="setView('trending')"
    >{{ 'gifPicker.trending' | translate }}</button>
  </div>
  <input
    type="text"
    [placeholder]="'gifPicker.searchKlipy' | translate"
    [(ngModel)]="searchQuery"
    (input)="onSearchInput()"
    class="gif-search-input"
  />

  <div class="gif-grid" [class.loading]="loading()">
    @if (loading()) {
      <div class="gif-spinner">{{ 'gifPicker.loading' | translate }}</div>
    }
    @for (gif of gifs(); track gif.id) {
      <img
        [src]="getPreviewUrl(gif)"
        [alt]="gif.title"
        (click)="selectGif(gif)"
        class="gif-thumb"
        loading="lazy"
      />
    } @empty {
      @if (!loading()) {
        <p class="gif-empty">{{ 'gifPicker.noGifsFound' | translate }}</p>
      }
    }
  </div>

  <a class="logo-link gif-powered-by" [href]="klipyUrl" target="_blank" rel="noopener noreferrer" aria-label="KLIPY">
    <img src="images/klipy.png" alt="KLIPY" />
  </a>
</div>
