<article class="legal-page">
  <a routerLink="/" class="legal-back">&larr; {{ 'legal.back' | translate }}</a>
  <h1>{{ 'legal.' + doc + '.title' | translate }}</h1>
  <p class="legal-draft">{{ 'legal.updated' | translate }}</p>
  @for (section of list(); track section.heading) {
    <section>
      <h2>{{ section.heading }}</h2>
      <p>{{ section.body }}</p>
    </section>
  }
</article>
