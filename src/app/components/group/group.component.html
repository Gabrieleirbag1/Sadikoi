<section class="main-container">
  <header class="group-header">
    <div class="group-header-title">
      <span>{{ group()?.name }}</span>
    </div>
    <div class="group-header-actions">
      <span class="icon-button" role="button" tabindex="0" (click)="fetchInvitation()" [title]="(isNative ? 'group.shareGroupInvitation' : 'group.getGroupInvitation') | translate">
        <img src="images/icons/invite.svg" width="24" height="24" alt="List View" />
      </span>
      <span class="icon-button" role="button" tabindex="0" (click)="openGroupOptionsModal()" title="{{ 'group.groupOptions' | translate }}">
        <img src="images/icons/settings.svg" width="24" height="24" alt="List View" />
      </span>
      <span
        class="icon-button"
        role="button"
        tabindex="0"
        (click)="showNotifications.set(true)"
        (keydown.enter)="showNotifications.set(true)"
        [title]="'notificationSettings.groupTitle' | translate"
      >
        <img src="images/icons/bell.svg" width="24" height="24" [alt]="'notificationSettings.groupTitle' | translate" />
      </span>
    </div>
  </header>
  @if (group()) {
    <app-question [group]="group()" [(question)]="question"></app-question>
  } @else {
    <p>{{ 'group.loadingGroup' | translate }}</p>
  }
</section>
<app-home-footer
  [(homeState)]="homeState"
  [groupId]="group()?.id ?? null"
  [redirect]="true"
></app-home-footer>
<app-group-options-modal [group]="group()" (groupChange)="group.set($event)">
</app-group-options-modal>
@if (showNotifications() && group(); as g) {
  <app-group-notifications-modal [groupId]="g.id" (closed)="showNotifications.set(false)" />
}
