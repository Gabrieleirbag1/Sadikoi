<div class="calendar">
  <div class="calendar__header">
    <button type="button" class="calendar__nav" [attr.aria-label]="'calendar.previousMonth' | translate" (click)="prevMonth()">‹</button>
    <span class="calendar__title">{{ title }}</span>
    <button type="button" class="calendar__nav" [attr.aria-label]="'calendar.nextMonth' | translate" (click)="nextMonth()">›</button>
  </div>

  <div class="calendar__weekdays">
    @for (day of weekdays(); track $index) {
      <span>{{ day }}</span>
    }
  </div>

  <div class="calendar__days">
    @for (day of days(); track day.year + '-' + day.month + '-' + day.date) {
      <button
        type="button"
        class="calendar__day"
        [class.calendar__day--muted]="!day.isCurrentMonth"
        [class.calendar__day--today]="day.isToday"
        [class.calendar__day--selected]="day.isSelected"
        [disabled]="day.disabled"
        [attr.aria-current]="day.isToday ? 'date' : null"
        [attr.aria-pressed]="day.isSelected"
        (click)="selectDay(day)"
      >
        {{ day.date }}
      </button>
    }
  </div>

  <div class="calendar__footer">
    <button type="button" class="calendar__today" (click)="goToToday()">{{ 'calendar.today' | translate }}</button>
    <button type="button" class="calendar__clear" (click)="clearSelection()">{{ 'calendar.clear' | translate }}</button>
  </div>
</div>
