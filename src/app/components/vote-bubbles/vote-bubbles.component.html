<div #box class="vote-bubbles-box border" [class.voting]="isVoting()">
  <div class="vote-bubbles-clip">
    <canvas
      #canvas
      class="vote-bubbles-canvas"
      [class.clickable]="isVoting() && hoveredId() !== null"
      (pointerdown)="lastPointerType = $event.pointerType"
      (pointermove)="onPointerMove($event)"
      (pointerleave)="onPointerLeave()"
      (click)="onClick($event)"
      aria-hidden="true"
    ></canvas>
  </div>

  <div #obstacle class="vote-bubbles-obstacle">
    <ng-content></ng-content>
  </div>

  <ul class="sr-only">
    @for (candidate of candidates(); track candidate.id) {
      <li>
        <button type="button" [disabled]="!isVoting()" [attr.aria-pressed]="selectedIds().includes(candidate.id)" (click)="select(candidate.id)">
          {{ candidate.name }}@if (candidate.answer) {: {{ candidate.answer }}} ({{ candidate.voters.length }})
        </button>
      </li>
    }
  </ul>

  @if (userProfileService.isOpenFor(tooltipUser(), tooltipScope)) {
    <div class="user-profile-popover vote-bubbles-tooltip" role="tooltip" [class.flip-x]="tooltipPos().flipX" [class.flip-y]="tooltipPos().flipY" [style.left.px]="tooltipPos().x" [style.top.px]="tooltipPos().y" (pointerenter)="keepTooltip()" (pointerleave)="scheduleHide()">
      <app-user-profile [user]="tooltipUser()" [group]="group()"></app-user-profile>
    </div>
  }

  @if (isVoting() && selectedIds().length >= requiredCount()) {
    <div class="vote-bubbles-submit">
      <button type="button" class="background-success" (click)="confirm()">{{ 'question.submitAnswer' | translate }}</button>
    </div>
  }
</div>
