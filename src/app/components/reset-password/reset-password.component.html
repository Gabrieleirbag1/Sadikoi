<section class="main-container">
  <div class="reset-container border shadow shadow-large">
    <h1>{{ 'resetPassword.title' | translate }}</h1>
    <form (submit)="onSubmit($event)">
      <label for="password">{{ 'auth.newPassword' | translate }}</label>
      <input id="password" type="password" autocomplete="new-password" [formField]="resetForm.password" />
      <label for="confirmPassword">{{ 'auth.confirmNewPassword' | translate }}</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" [formField]="resetForm.confirmPassword" />
      <button type="submit" class="paper-btn btn-block background-secondary" [disabled]="submitting()">
        {{ 'resetPassword.submit' | translate }}
      </button>
    </form>
    <div class="reset-links">
      <a routerLink="/forgot-password">{{ 'resetPassword.requestNewLink' | translate }}</a>
    </div>
  </div>
</section>
